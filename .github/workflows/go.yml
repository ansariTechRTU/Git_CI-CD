name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.22'

      - name: Build
        working-directory: ch1_integration/01_04_ci_for_go
        run: go build -v ./...

      - name: Test
        working-directory: ch1_integration/01_04_ci_for_go
        run: go test -v ./...
